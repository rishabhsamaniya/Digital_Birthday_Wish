services:
  - type: web
    name: digital-birthday-wish
    runtime: python
    buildCommand: pip install -r requirements.txt && DJANGO_SETTINGS_MODULE=config.settings.prod python manage.py collectstatic --no-input && DJANGO_SETTINGS_MODULE=config.settings.prod python manage.py migrate
    startCommand: DJANGO_SETTINGS_MODULE=config.settings.prod gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: digital-birthday-wish-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: digital-birthday-wish-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: digital-birthday-wish-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: digital-birthday-wish-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: digital-birthday-wish-db
          property: port

databases:
  - name: digital-birthday-wish-db
    databaseName: birthday_memories
    user: birthday_user
    plan: free