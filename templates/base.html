{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% if profile %}{{ profile.full_name }}'s Birthday Surprise{% else %}Birthday Memories{% endif %}{% endblock %}</title>

    <!-- Meta Description -->
    <meta name="description" content="{% block meta_description %}A personalized, dynamic digital birthday surprise experience for {{ profile.full_name|default:'unforgettable memories' }}.{% endblock %}">

    <!-- Google Fonts: Playfair Display & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN for utility classes) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Base CSS, Themes, Animations -->
    <link rel="stylesheet" href="{% static 'css/themes.css' %}">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <!-- Dynamic Theme CSS Variables Injection -->
    <style id="dynamic-theme-vars">
        :root {
            {% if theme %}
                {{ theme.css_variables|safe }}
            {% elif profile and profile.theme %}
                {{ profile.theme.css_variables|safe }}
            {% endif %}
        }
        body {
            background-color: var(--background-color, #020617);
            color: var(--text-color, #f8fafc);
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="h-full font-sans antialiased selection:bg-rose-500 selection:text-white flex flex-col justify-between overflow-x-hidden" style="background-color: var(--background-color, #020617); color: var(--text-color, #f8fafc);">
    
    <!-- Dynamic Theme Canvas Container -->
    <div id="theme-root" class="min-h-screen flex flex-col justify-between relative transition-colors duration-500">
        
        <!-- Ambient Background Glow Effects using Theme Colors -->
        <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
            <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full blur-3xl opacity-20 animate-pulse" style="background-color: var(--primary-color, #f43f5e);"></div>
            <div class="absolute top-1/3 -right-40 w-96 h-96 rounded-full blur-3xl opacity-15 animate-pulse delay-1000" style="background-color: var(--secondary-color, #f59e0b);"></div>
            <div class="absolute -bottom-40 left-1/3 w-96 h-96 rounded-full blur-3xl opacity-20 animate-pulse delay-700" style="background-color: var(--accent-color, #fb7185);"></div>
        </div>

        <!-- Main Content Slot -->
        <main class="relative z-10 flex-grow">
            {% block content %}{% endblock %}
        </main>

    </div>

    <!-- Core Scripts -->
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/animations.js' %}"></script>
    <script src="{% static 'js/navigation.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
