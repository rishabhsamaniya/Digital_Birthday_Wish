<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Birthday Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="h-full flex items-center justify-center p-4 bg-slate-950 text-slate-100 font-sans">

    <div class="max-w-md w-full backdrop-blur-2xl bg-white/5 border border-white/10 rounded-3xl p-8 sm:p-10 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center text-2xl shadow-xl shadow-rose-500/20">
                🎁
            </div>
            <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white">Platform Admin</h1>
            <p class="text-xs text-slate-400">Sign in to manage birthday profiles and dynamic experiences</p>
        </div>

        {% if messages %}
            <div class="space-y-2">
                {% for message in messages %}
                    <div class="p-3 rounded-xl text-xs font-medium bg-rose-500/15 border border-rose-500/30 text-rose-300">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 transition" placeholder="Admin username">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 transition" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-rose-500 to-amber-500 text-white font-medium shadow-lg shadow-rose-500/25 hover:scale-[1.02] active:scale-[0.98] transition-all">
                Sign In To Dashboard
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition">Return to Home</a>
        </div>
    </div>

</body>
</html>
