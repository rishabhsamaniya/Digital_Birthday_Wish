{% extends "base.html" %}

{% block title %}404 — Page Not Found | Birthday Memories{% endblock %}

{% block content %}
<section class="min-h-screen flex flex-col items-center justify-center text-center px-4 py-16 relative">
    <div class="max-w-xl w-full backdrop-blur-2xl bg-white/5 border border-white/10 rounded-3xl p-8 sm:p-14 shadow-2xl space-y-6">
        
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-mono tracking-widest uppercase">
            Error 404
        </div>

        <h1 class="font-serif text-5xl sm:text-7xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-rose-300 to-amber-400">
            Lost In Memory
        </h1>

        <p class="text-slate-300 text-base sm:text-lg font-light leading-relaxed">
            The birthday profile or page you are looking for doesn't seem to exist or may have moved.
        </p>

        <div class="pt-6 flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="/" class="w-full sm:w-auto px-8 py-3 rounded-full bg-gradient-to-r from-rose-500 to-amber-500 text-white font-medium shadow-lg hover:scale-105 transition-all">
                Return to Home
            </a>
        </div>
    </div>
</section>
{% endblock %}
